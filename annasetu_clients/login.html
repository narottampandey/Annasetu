<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Annasetu – Login</title>
  <meta name="description" content="Login to your Annasetu account to donate or claim food." />

  <!-- Font Awesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
  <!-- Google Sign-In SDK -->
  <script src="https://accounts.google.com/gsi/client" async defer></script>
  <!-- Styles -->
  <link rel="stylesheet" href="css/login.css" />
</head>

<body>
  <div class="container">

    <!-- ── LEFT PANEL ── -->
    <div class="left-panel">
      <img src="foodimages/main5.jpg" alt="Food community" class="left-panel-image" />
      <div class="left-panel-overlay"></div>
      <h1>अन्न-Setu</h1>
      <p>Bridging surplus food with people, cattle farms and fertilizer centers.</p>
      <div class="left-panel-badge">
        <span class="badge-item"><i class="fa fa-leaf"></i> Zero Waste</span>
        <span class="badge-item"><i class="fa fa-heart"></i> Community</span>
        <span class="badge-item"><i class="fa fa-seedling"></i> Sustainable</span>
      </div>
    </div>

    <!-- ── RIGHT PANEL ── -->
    <div class="right-panel">
      <div class="login-box">
        <h2>Welcome Back</h2>
        <p class="subtitle">Sign in to your account to continue</p>

        <!-- Google Sign-In -->
        <a href="http://localhost:5000/api/auth/google" class="google-btn-primary" id="googleLoginBtn">
          <svg class="google-icon" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
            <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
            <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
            <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/>
            <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/>
          </svg>
          Sign in with Google
        </a>

        <div class="divider"><span>or continue with email</span></div>

        <!-- Email Login -->
        <form class="email-login" id="loginForm">
          <div class="input-field">
            <i class="fa fa-envelope"></i>
            <input type="email" name="email" id="loginEmail" placeholder="Email address" required />
          </div>
          <div class="input-field">
            <i class="fa fa-lock"></i>
            <input type="password" name="password" id="loginPassword" placeholder="Password" required />
          </div>
          <button type="submit" class="login-btn" id="loginSubmitBtn">
            <i class="fa fa-sign-in-alt"></i> Login with Email
          </button>
        </form>

        <div class="links">
          <a href="forgot-password.html">Forgot password?</a>
          <p>Don't have an account? <a href="register.html">Register</a></p>
        </div>
      </div>
    </div>

  </div>

  <script src="env.js"></script>
  <script src="js/login.js"></script>
</body>
</html>
